name: Instaladores (Windows e macOS)
on:
  push:
    branches: [comercial]
    tags: ['v*']
    paths: ['desktop/**', 'index.html', 'vst/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSAO: "1.2.0"
  AURA_BUILD: ${{ github.run_number }}
jobs:
  plugin-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar plugin VST3
        shell: bash
        run: |
          cmake -S vst -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4
          mkdir -p plugin-out && cp -R build/AuraSynthBass_artefacts/Release/VST3/*.vst3 plugin-out/
      - uses: actions/upload-artifact@v4
        with: { name: plugin-win, path: plugin-out }
  plugin-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar plugin VST3 e AU
        run: |
          cmake -S vst -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4
          mkdir -p plugin-out
          cp -R build/AuraSynthBass_artefacts/Release/VST3/*.vst3 plugin-out/
          cp -R build/AuraSynthBass_artefacts/Release/AU/*.component plugin-out/
          codesign --force --deep -s - plugin-out/*.vst3 || true
          codesign --force --deep -s - plugin-out/*.component || true
      - uses: actions/upload-artifact@v4
        with: { name: plugin-mac, path: plugin-out }
  instalador-win:
    needs: plugin-win
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: plugin-win, path: desktop/plugins/win }
      - name: Gerar instalador .exe
        shell: bash
        working-directory: desktop
        run: |
          ls -R plugins/win | head -20
          npm install --no-audit --no-fund
          npm run dist:win
          ls dist
          cp dist/*.exe ../AURA-Synth-Bass-Windows.exe
      - uses: actions/upload-artifact@v4
        with: { name: AURA-Synth-Bass-Windows-Setup, path: "AURA-Synth-Bass-Windows.exe" }
  instalador-mac:
    needs: plugin-mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: plugin-mac, path: desktop/plugins/mac }
      - name: Gerar o app (universal)
        working-directory: desktop
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tail -5
          npm run dist:mac 2>&1 | tee ../mac.log
          ls dist
      - name: Enviar log do app (diagnóstico)
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@example.com
          cp mac.log /tmp/l.log 2>/dev/null || echo "sem log" > /tmp/l.log
          git checkout --orphan buildlogdesk && git rm -rf . -q || true
          cp /tmp/l.log mac.log && git add mac.log && git commit -m "log desktop mac" -q && git push -f origin buildlogdesk
      - name: Montar o instalador .pkg (app + VST3 + AU)
        run: |
          set -e
          APP=$(ls -d desktop/dist/mac-universal/*.app | head -1)
          mkdir -p pkgroot/app/Applications pkgroot/vst3 pkgroot/au pkgs
          cp -R "$APP" pkgroot/app/Applications/
          mkdir -p pkgroot/vst3/Library/Audio/Plug-Ins/VST3 pkgroot/au/Library/Audio/Plug-Ins/Components
          cp -R "desktop/plugins/mac/AURA Synth Bass.vst3" pkgroot/vst3/Library/Audio/Plug-Ins/VST3/
          cp -R "desktop/plugins/mac/AURA Synth Bass.component" pkgroot/au/Library/Audio/Plug-Ins/Components/
          pkgbuild --root pkgroot/app  --identifier br.com.ledixplugins.aurasynthbass.app  --version $VERSAO pkgs/app.pkg
          pkgbuild --root pkgroot/vst3 --identifier br.com.ledixplugins.aurasynthbass.vst3 --version $VERSAO pkgs/vst3.pkg
          pkgbuild --root pkgroot/au   --identifier br.com.ledixplugins.aurasynthbass.au   --version $VERSAO pkgs/au.pkg
          cp desktop/build/EULA.txt pkgs/license.txt
          cat > pkgs/dist.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="1">
            <title>AURA Synth Bass</title>
            <license file="license.txt"/>
            <options customize="allow" require-scripts="false" hostArchitectures="x86_64,arm64"/>
            <choices-outline><line choice="app"/><line choice="vst3"/><line choice="au"/></choices-outline>
            <choice id="app"  title="Aplicativo AURA Synth Bass" description="Instala o programa na pasta Aplicativos."><pkg-ref id="br.com.ledixplugins.aurasynthbass.app"/></choice>
            <choice id="vst3" title="Plugin VST3" description="Para Reaper e outras DAWs."><pkg-ref id="br.com.ledixplugins.aurasynthbass.vst3"/></choice>
            <choice id="au"   title="Plugin Audio Unit (AU)" description="Para Logic, GarageBand e outras DAWs AU."><pkg-ref id="br.com.ledixplugins.aurasynthbass.au"/></choice>
            <pkg-ref id="br.com.ledixplugins.aurasynthbass.app">app.pkg</pkg-ref>
            <pkg-ref id="br.com.ledixplugins.aurasynthbass.vst3">vst3.pkg</pkg-ref>
            <pkg-ref id="br.com.ledixplugins.aurasynthbass.au">au.pkg</pkg-ref>
          </installer-gui-script>
          X
          sed -i '' 's/^          //' pkgs/dist.xml
          productbuild --distribution pkgs/dist.xml --package-path pkgs --resources pkgs "AURA-Synth-Bass-macOS.pkg"
          ls -la *.pkg
      - uses: actions/upload-artifact@v4
        with: { name: AURA-Synth-Bass-macOS-Setup, path: "*.pkg" }
  publicar:
    # publica os instaladores como Release (a página de download aponta para /releases/latest)
    if: github.ref == 'refs/heads/comercial' || startsWith(github.ref, 'refs/tags/v')
    needs: [instalador-win, instalador-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: AURA-Synth-Bass-Windows-Setup, path: rel }
      - uses: actions/download-artifact@v4
        with: { name: AURA-Synth-Bass-macOS-Setup, path: rel }
      - name: Criar ou atualizar release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v${VERSAO}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release upload "$TAG" rel/* --clobber --repo "${{ github.repository }}" \
            || gh release create "$TAG" rel/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AURA Synth Bass $TAG" --notes "Instaladores do AURA Synth Bass para Windows e macOS. © 2026 Thiago R. Galvão."
  atualizacao:
    # publica a interface nova, assinada, para os apps já instalados se atualizarem sozinhos (sem reinstalar)
    if: github.ref == 'refs/heads/comercial' || startsWith(github.ref, 'refs/tags/v')
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Gerar o pacote de atualização assinado
        env:
          AURA_UPDATE_KEY: ${{ secrets.AURA_UPDATE_KEY }}
          AURA_VERSAO: ${{ env.VERSAO }}
        run: node tools/gerar_atualizacao.js aura-update.json
      - name: Publicar na Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "v${VERSAO}" aura-update.json --clobber --repo "${{ github.repository }}"
